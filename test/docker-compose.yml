services:
  sftp:
    image: linuxserver/openssh-server
    environment:
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=password
      - USER_NAME=user
      - LOG_STDOUT=true
    ports:
      - "2222:2222"
    healthcheck:
      test: ["CMD-SHELL", "netstat -an | grep -q :2222 || exit 1"]
      interval: 5s
      timeout: 30s
      retries: 5

  floci:
    image: floci/floci
    environment:
      - FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED=true
    ports:
      - "4566:4566"

  minio:
    image: cccs/minio
    environment:
      MINIO_ROOT_USER: al_storage_key
      MINIO_ROOT_PASSWORD: Ch@ngeTh!sPa33w0rd
    ports:
      - "9000:9000"
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    environment:
      - xpack.security.enabled=true
      - discovery.type=single-node
      - logger.level=WARN
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - ELASTIC_PASSWORD=devpass
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail -u elastic:$$ELASTIC_PASSWORD localhost:9200/_cluster/health || exit 1",
        ]
      interval: 30s
      timeout: 30s
      retries: 3

  redis:
    image: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  pytest:
    build:
      context: ..
      dockerfile: ./test/Dockerfile
      args:
        - PYTHON_VERSION=${PYTHON_VERSION:-3.14}
    environment:
      SAMPLES_LOCATION: /tmp/samples
    volumes:
      - ${PATH_REWRITE:-.}/config/:/etc/assemblyline/
      - ${ROOT_REWRITE:-../..}/assemblyline-base/test:/opt/alv4/assemblyline-base/test
      - ${ROOT_REWRITE:-../..}/unittest-samples:/tmp/samples
    working_dir: /opt/alv4/assemblyline-base
    command: "pytest -vv --full-trace"
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      sftp:
        condition: service_healthy
    network_mode: "host"
