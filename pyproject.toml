[build-system]
requires = ["cython", "setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assemblyline"
description = "Assemblyline 4 - Automated malware analysis framework"
license = "MIT"
requires-python = ">=3.11"
version = "4.0.0.dev0"
dynamic = ["readme"]
authors = [
    { name = "CCCS Assemblyline development team", email = "assemblyline@cyber.gc.ca" },
]
keywords = [
    "assemblyline",
    "automated",
    "malware",
    "analysis",
    "gc",
    "canada",
    "cse-cst",
    "cse",
    "cst",
    "cyber",
    "cccs",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "arrow",
    "aiohttp",
    "lark",
    "urllib3>=2.6.0",
    "python-baseconv",
    "boto3",
    "pysftp",
    "redis",
    "requests[socks]",
    "elasticsearch>=8.0.0,<9.0.0",
    "python-datemath!=3.0.2",
    "packaging",
    "PyYAML",
    "bcrypt",
    "cart",
    "assemblyline-toolbox>=0.4.0",
    "python-magic",
    "pytz",
    "apscheduler",
    "websocket_client<1.0.0",
    "elastic-apm[flask]>=6.13.0",
    "notifications-python-client",
    "rstr",
    # Blacklist a bad release of the azure library until a release newer than that comes out
    "azure-storage-blob!=12.4.0",
    "azure-identity",
    "msoffcrypto-tool",
    "chardet<6",
    "yara-python",
    "hauntedhouse==0.1.10",
    "magika",
    "paramiko<4",
]

[project.urls]
Repository = "https://github.com/CybercentreCanada/assemblyline-base"

[project.optional-dependencies]
test = ["pytest", "retrying", "pytest-mock", "pyftpdlib", "pyopenssl"]

[project.scripts]
al_cli = "assemblyline.run.cli:shell_main"

[tool.setuptools.dynamic]
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools.packages.find]
exclude = ["test", "test/*"]

[tool.setuptools.package-data]
"*" = [
    "*classification.yml",
    "*tag_safelist.yml",
    "*.magic",
    "*.yara",
    "*sample_rules.yar",
    "*sample_suricata.rules",
    "*.pyx",
    "*.pxd",
    "*.lark",
    "VERSION",
]
assemblyline = ["py.typed"]

[tool.coverage.run]
omit = ["test/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
